[package]
name = "flowfinder"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "flowfinder"
path = "src/main.rs"

[dependencies]
pcap              = { version = "2", features = ["capture-stream"] }
ratatui           = "0.29"
crossterm         = "0.28"
clap              = { version = "4", features = ["derive"] }
etherparse        = "0.15"
httparse          = "1"
crossbeam-channel = "0.5"
chrono            = { version = "0.4", default-features = false, features = ["clock", "std"] }
indexmap          = "2"
